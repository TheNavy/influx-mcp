name: Test and build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Rebuild on the 1st of every month, so the published image picks up
    # fixes in the base image even when the code has not changed.
    - cron: "23 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The image is published from main and from version tags. Every other run
  # builds it as well, to prove the Dockerfile works, but does not publish.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  test:
    # A pull request from a branch of this repository is already covered by its push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest -v

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for this machine
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: influx-mcp:ci

      - name: Start the container and wait until it is healthy
        run: |
          docker run -d --name ci -p 5001:5001 --read-only --cap-drop ALL \
            -e INFLUXDB_URL=http://127.0.0.1:8086 \
            -e INFLUXDB_TOKEN=ci -e INFLUXDB_ORG=ci influx-mcp:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5001/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs ci
          exit 1

      - name: Ask the container for its tools
        run: |
          curl --silent --fail http://127.0.0.1:5001/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep --quiet '"list_buckets"'

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - name: Build for amd64 and arm64, publish from main and tags
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
